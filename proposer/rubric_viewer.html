ssible points: 10"}, "expert_hypothesis": "", "capsule_hypothesis": "Multi-drug resistant (MDR) E. coli strains will exhibit higher mutation rates resulting in more SNPs compared to retail meat isolates, and transition mutations will predominate over transversions in both samples.", "capsule_result": "The MDR E. coli sample (SRR35233585) had 101,817 SNPs compared to 94,440 SNPs in the retail meat sample (SRR35228486), supporting the hypothesis of higher mutation rates in MDR strains. Both samples showed a predominance of transitions over transversions with Ts/Tv ratios of 2.68 and 2.55 respectively, consistent with typical bacterial mutation patterns.", "capsule_accepted": true, "categories": ["['Whole Genome Sequencing (WGS)'", "'SNP Analysis'", "'Genomics'", "'Antimicrobial Resistance']"], "paper": "Not Available", "short_id": "bix-61", "alignment": null, "alignment_preview": null, "expert_items": [{"question": "Based on the provided data, describe in one concise sentence how the MDR strain accumulates mutations compared to the retail meat strain.", "rubric": "Correct answer: The MDR strain accumulates mutations at a rate of 101,817 SNPs which is higher than the retail meat strain (94,440 SNPs).\n\nComparison mode: llm_verifier. The answer must be equivalent to this value; judge the meaning, not the wording.\nScoring is binary: 1 point for the correct answer, 0 otherwise.\n\nPlausible but INCORRECT answers:\n* The MDR strain accumulates mutation at a lower rate than the retail meat strain\n* The MDR strain and the retail meat strain accumulate mutations at the same rate.\n* The retail meat strain accumulates mutations at a higher rate than the MDR strain.", "points": 1, "eval_mode": "llm_verifier", "ideal": "The MDR strain accumulates mutations at a rate of 101,817 SNPs which is higher than the retail meat strain (94,440 SNPs).", "distractors": ["The MDR strain accumulates mutation at a lower rate than the retail meat strain", "The MDR strain and the retail meat s });
document.getElementById('s-hyp').textContent = RECORDS.length;
document.getElementById('s-crit').textContent = nCrit;
document.getElementById('s-pts').textContent = nPts;
document.getElementById('s-exp').textContent = RECORDS.filter(r => r.expert_items.length).length + '/' + RECORDS.length;

/* ---- filter state ---- */
const state = {q:'', align:'all', tag:'all', id:null};

function buildChips(host, opts, key){
  opts.forEach(o => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.val = o.val;
    b.innerHTML = esc(o.label) + (o.count != null ? `<span class="count">${o.count}</span>` : '');
    b.setAttribute('aria-pressed', String(state[key] === o.val));
    b.addEventListener('click', () => {
      state[key] = o.val;
      host.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.val === o.val)));
      render();
    });
    host.appendChild(b);
  });
}
const alignCounts = v => RECORDS.filter(r => r.alignment && r.alignment.rating === v).length;
buildChips(document.getElementById('f-align'), [
  {val:'all', label:'All', count:RECORDS.length},
  {val:'2', label:'Same claim', count:alignCounts(2)},
  {val:'1', label:'Related', count:alignCounts(1)},
  {val:'0', label:'Unrelated', count:alignCounts(0)},
  {val:'none', label:'No expert ref', count:RECORDS.filter(r => !r.alignment).length}
], 'align');
buildChips(document.getElementById('f-tag'), [{val:'all', label:'All', count:nCrit}].concat(
  Object.entries(allTags).sort((a,b) => b[1]-a[1]).map(([t,c]) => ({val:t, label:TAG_LABEL[t]||t, count:c}))
), 'tag');

function matches(r){
  if (state.align !== 'all'){
    if (state.align === 'none'){ if (r.alignment) return false; }
    else if (!r.alignment || String(r.alignment.rating) !== state.align) return false;
  }
  if (state.tag !== 'all' && !r.rubric.items.some(it => it.tags.includes(state.tag))) return false;
  if (state.q){
    const hay = [r.hypothesis, r.rubric_raw, r.expert_hypothesis, r.capsule_id, r.short_id,
                 r.capsule_result, r.categories.join(' '),
                 r.expert_items.map(e => e.question + ' ' + e.rubric).join(' ')].join(' ').toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

/* ---- rail list ---- */
const listEl = document.getElementById('list');
function renderList(rows){
  listEl.innerHTML = '';
  if (!rows.length){
    listEl.innerHTML = '<li class="empty" style="padding:14px">No hypotheses match these filters.</li>';
    return;
  }
  rows.forEach(r => {
    const li = document.createElement('li');
    const rating = r.alignment ? RATING[r.alignment.rating] : null;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'item'; b.dataset.id = r.id;
    b.setAttribute('aria-current', String(r.id === state.id));
    b.innerHTML = `
      <span class="item-head">
        <span class="dot ${rating ? rating.dot : 'rn'}" title="${rating ? esc(rating.label) : 'No expert hypothesis on file'}"></span>
        <span class="item-id">${esc(r.short_id || r.capsule_id.slice(0,8))}</span>
        <span class="item-pts">${r.rubric.items.length} crit · ${r.max_points} pt</span>
      </span>
      <span class="item-txt">${esc(r.hypothesis)}</span>`;
    b.addEventListener('click', () => { state.id = r.id; render(); document.getElementById('detail').scrollTop = 0; });
    li.appendChild(b); listEl.appendChild(li);
  });
}

/* ---- detail ---- */
function critCard(it, max){
  const w = Math.round(it.points / max * 100);
  return `<article class="crit">
    <div class="crit-top">
      <span class="crit-n">${it.n}</span>
      <span class="pts">${it.points} ${it.points === 1 ? 'point' : 'points'}</span>
    </div>
    <p>${esc(it.text)}</p>
    ${it.tags.length ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(TAG_LABEL[t]||t)}</span>`).join('')}</div>` : ''}
    <div class="weight"><i style="width:${w}%"></i></div>
  </article>`;
}
function expertCard(e, i){
  const dist = e.distractors.length
    ? `<div class="kv"><span class="k">Distractors</span><span class="mono" style="font-size:11.5px;color:var(--muted)">${e.distractors.map(esc).join(' · ')}</span></div>` : '';
  const ideal = e.ideal
    ? `<div class="kv"><span class="k">Ideal</span><span class="mono" style="font-size:11.5px;color:var(--ink)">${esc(e.ideal)}</span></div>` : '';
  return `<details class="qa">
    <summary>
      <span class="qn">Q${i+1}</span>
      <span class="qtext">${esc(e.question)}</span>
      <span class="caret">▸</span>
    </summary>
    <div class="qbody">
      <pre>${esc(e.rubric)}</pre>
      <div class="kv">
        <span class="k">Grading</span><span class="mono" style="font-size:11.5px;color:var(--muted)">${esc(e.eval_mode || 'n/a')} · ${e.points} pt${e.lang ? ' · ' + esc(e.lang) : ''}</span>
      </div>
      ${ideal}${dist}
    </div>
  </details>`;
}

const detailEl = document.getElementById('detail');
function renderDetail(r){
  if (!r){ detailEl.innerHTML = '<p class="empty">Select a hypothesis from the list.</p>'; return; }
  const rating = r.alignment ? RATING[r.alignment.rating] : null;
  const totalPts = r.expert_items.reduce((a,e) => a + e.points, 0);
  detailEl.innerHTML = `
  <div class="wrap">
    <div class="dhead">
      <div class="dmeta">
        <span class="eyebrow">Proposed hypothesis</span>
        <span class="tag mono">${esc(r.short_id || 'unlisted')}</span>
        <span class="tag mono">${esc(r.capsule_id)}</span>
        ${r.lang ? `<span class="tag">${esc(r.lang)}</span>` : ''}
        <span class="tag">${r.rubric.items.length} criteria · ${r.max_points} points</span>
      </div>
      <h2>${esc(r.hypothesis)}</h2>
      ${r.categories.length ? `<div class="tags">${r.categories.map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div>` : ''}
    </div>

    <div class="verdict">
      <span class="badge ${rating ? rating.cls : 'vn'}">${rating ? esc(rating.label) : 'No expert hypothesis'}</span>
      <p><span class="vt">Judge comparison vs. expert hypothesis</span>${
        r.alignment ? esc(r.alignment.justification) : 'This capsule has no expert hypothesis recorded in the proposer output, so no comparison was run.'
      }</p>
    </div>

    <div class="cols">
      <section class="col col-gen">
        <div class="colhead">
          <h3>Proposer rubric</h3>
          <span class="sub">agent mode · ${r.max_points} pt</span>
        </div>
        <div class="stack">${r.rubric.items.map(it => critCard(it, r.max_points)).join('')}</div>
        <details class="raw">
          <summary>Raw rubric text</summary>
          <pre>${esc(r.rubric_raw)}</pre>
        </details>
      </section>

      <section class="col col-exp">
        <div class="colhead">
          <h3>Expert reference</h3>
          <span class="sub">${r.expert_items.length ? r.expert_items.length + ' questions · ' + totalPts + ' pt' : 'none on file'}</span>
        </div>
        <div class="stack">
          ${r.expert_hypothesis ? `<div class="card quote">
            <p class="eyebrow lbl">Expert hypothesis</p>
            <p class="qt">${esc(r.expert_hypothesis)}</p>
            ${r.capsule_hypothesis && r.capsule_hypothesis !== r.expert_hypothesis
              ? `<p class="body"><b>Capsule original:</b> ${esc(r.capsule_hypothesis)}</p>` : ''}
          </div>` : `<div class="card"><p class="empty" style="padding:0">No expert hypothesis recorded for this capsule.</p></div>`}

          ${r.capsule_result ? `<div class="card">
            <p class="eyebrow lbl">Published result${r.capsule_accepted != null ? ` · hypothesis ${r.capsule_accepted ? 'accepted' : 'rejected'}` : ''}</p>
            <p class="body">${esc(r.capsule_result)}</p>
            ${r.paper ? `<p class="body mono" style="font-size:11.5px">${esc(r.paper)}</p>` : ''}
          </div>` : ''}

          ${r.expert_items.length
            ? `<p class="eyebrow" style="margin:8px 0 -2px">Expert rubrics — ${r.expert_items.length} graded questions on the same capsule</p>`
              + r.expert_items.map(expertCard).join('')
            : `<div class="card"><p class="empty" style="padding:0">No expert rubrics: this capsule is not in the BixBench question set.</p></div>`}
        </div>
      </section>
    </div>
    <p class="hint">Navigate with <kbd>j</kbd> / <kbd>k</kbd> or the arrow keys · <kbd>/</kbd> focuses search</p>
  </div>`;
}

/* ---- render ---- */
let visible = [];
function render(){
  visible = RECORDS.filter(matches);
  if (!visible.some(r => r.id === state.id)) state.id = visible.length ? visible[0].id : null;
  renderList(visible);
  renderDetail(RECORDS.find(r => r.id === state.id));
  const cur = listEl.querySelector('[aria-current="true"]');
  if (cur) cur.scrollIntoView({block:'nearest'});
}

document.getElementById('q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing){ e.preventDefault(); document.getElementById('q').focus(); return; }
  if (typing) return;
  const step = (e.key === 'j' || e.key === 'ArrowDown') ? 1 : (e.key === 'k' || e.key === 'ArrowUp') ? -1 : 0;
  if (!step || !visible.length) return;
  e.preventDefault();
  const i = visible.findIndex(r => r.id === state.id);
  state.id = visible[Math.min(visible.length - 1, Math.max(0, i + step))].id;
  render(); detailEl.scrollTop = 0;
});

const root = document.documentElement, themeBtn = document.getElementById('theme');
themeBtn.addEventListener('click', () => {
  const dark = root.getAttribute('data-theme') === 'dark'
    || (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
});

render();
</script>
