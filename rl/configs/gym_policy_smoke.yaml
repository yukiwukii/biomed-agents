# rl/configs/gym_policy_smoke.yaml
# =============================================================================
# Policy server for the SMOKE GATE ONLY. Never used during training.
#
# During GRPO, NeMo RL owns the policy: run_grpo_nemo_gym.py launches its own
# colocated vLLM and injects ${policy_base_url} into
#   responses_api_models/vllm_model/configs/vllm_model_for_training.yaml,
# which is what makes rollouts on-policy and carries token ids + logprobs back
# to the trainer.
#
# But rl/scripts/00_smoke_rollout.sh runs `ng_run` standalone — no NeMo RL, no
# trainer — precisely so the environment plumbing can be validated before the
# GPU-heavy machinery is involved. That standalone stack still needs *a* model,
# so this file supplies one.
#
# DO NOT add this file to env.nemo_gym.config_paths in any GRPO config.
# Two policy servers would start, rollouts would be generated by the untrained
# one, and GRPO would compute importance ratios against a model that never
# produced the samples. That failure is silent — the loss still goes down.
#
# Adapted from the shipped serving config:
#   bbh-third-party/Gym/responses_api_models/local_vllm_model/configs/Qwen/Qwen3.5-27B.yaml
# =============================================================================

policy_model:
  responses_api_models:
    local_vllm_model:
      entrypoint: app.py
      model: ${oc.env:BBH_POLICY_MODEL,Qwen/Qwen3.5-9B}
      # Empty list -> launch vLLM locally. To point at a vLLM you already have
      # running (e.g. one of the 172.16.44.x servers), override at the CLI:
      #   ++policy_model.responses_api_models.local_vllm_model.base_url='["http://172.16.44.233:8000/v1"]'
      # pydantic rejects null here; use [] for "launch locally".
      base_url: []
      # false is correct for the smoke gate: nothing consumes token ids here.
      # The training path sets this true via vllm_model_for_training.yaml.
      return_token_id_information: false
      uses_reasoning_parser: true
      replace_developer_role_with_system: true
      debug: false
      chat_template_kwargs:
        enable_thinking: true
        # REQUIRED for the measured length to mean anything. Training sets this
        # (grpo_hypotest_27b.yaml) because NeMo RL asserts the re-sent prefix is
        # a monotonic extension of what the model generated; without it the
        # template strips <think> from prior turns, the prefix comes back
        # SHORTER than what was produced, and vLLM 500s the rollout (0.4).
        #
        # It also changes what the context costs: with it, every previous turn's
        # reasoning is re-sent. The 2026-08-07 smoke run omitted it and measured
        # max 46,812 tok, which therefore UNDER-states training by roughly the
        # retained-thinking payload. Keep it in step with the GRPO config.
        preserve_thinking: true
      extra_body:
        # These MUST match the GRPO config's policy.generation block, or the
        # gate measures a distribution training never uses.
        #
        # They had drifted: this file said top_p 0.95 / top_k 20 / max_tokens
        # 8192 while grpo_hypotest_27b.yaml says 1.0 / null / 4090 — under a
        # comment claiming they matched. The defaults below are now the GRPO
        # values, and each is overridable so the two sampling regimes can be
        # A/B'd without editing the file:
        #
        #   training-like (default):  SMOKE_TOP_P=1.0   SMOKE_TOP_K=null
        #   inference-like:           SMOKE_TOP_P=0.95  SMOKE_TOP_K=20
        #
        # The second pair is what the model's own generation_config.json
        # specifies, i.e. what a plain `vllm serve` applies — so it is what the
        # standalone benchmark endpoints have been using.
        temperature: ${oc.decode:${oc.env:SMOKE_TEMPERATURE,1.0}}
        top_p: ${oc.decode:${oc.env:SMOKE_TOP_P,1.0}}
        top_k: ${oc.decode:${oc.env:SMOKE_TOP_K,null}}
        # Per-turn OUTPUT cap, and it must be `max_tokens` (the
        # chat-completions name). Setting max_output_tokens: null makes vLLM
        # budget the entire max_model_len for output and reject any non-empty
        # input. Constraint per request: input + max_tokens <= max_model_len.
        max_tokens: ${oc.decode:${oc.env:SMOKE_MAX_TOKENS,4090}}
      hf_home: ${oc.env:HF_HOME,null}
      vllm_serve_env_vars:
        VLLM_RAY_DP_PACK_STRATEGY: strict
      vllm_serve_kwargs:
        data_parallel_size: 1
        # Must match the GPU count of the workload. The 9B is 19.3 GB bf16,
        # so the smoke workload runs it at TP=1 on a single H100.
        tensor_parallel_size: ${oc.decode:${oc.env:SMOKE_TP,4}}
        pipeline_parallel_size: 1
        trust_remote_code: true
        # Deliberately equal to policy.max_total_sequence_length in the GRPO
        # config. The smoke gate exists partly to find out how often episodes
        # hit this ceiling — raising it here would hide exactly the problem we
        # are trying to measure.
        max_model_len: ${oc.decode:${oc.env:SMOKE_MAX_SEQ_LEN,32768}}
        # Skip the vision tower. Qwen3.5-9B is multimodal-wrapped (333 of its
        # 775 tensors are model.visual.*); hypotest is text-only, so profiling
        # the encoder wastes memory and startup time. This ALSO means the served
        # policy cannot consume images -- see cfg.STRIP_IMAGES.
        language_model_only: true
        gpu_memory_utilization: 0.85
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_coder
        reasoning_parser: qwen3
        # -------------------------------------------------------------------
        # The three settings below are the conservative, hybrid-safe values
        # for Qwen3.5-9B's hybrid linear attention (full_attention_interval 4).
        #
        # bbh's inference config documents the failure modes on this family:
        # a conv1d cache assert that a low max_num_seqs avoids, and a conflict
        # between the GDN/SSM recurrent state and the prefix cache. CUDA-graph
        # capture over conv1d/SSM ops is the other sharp edge, hence eager.
        #
        # For a dense model you can relax all three:
        #   SMOKE_ENFORCE_EAGER=false SMOKE_MAX_NUM_SEQS=16 SMOKE_PREFIX_CACHE=true
        # -------------------------------------------------------------------
        enforce_eager: ${oc.decode:${oc.env:SMOKE_ENFORCE_EAGER,true}}
        max_num_seqs: ${oc.decode:${oc.env:SMOKE_MAX_NUM_SEQS,4}}
        enable_prefix_caching: ${oc.decode:${oc.env:SMOKE_PREFIX_CACHE,false}}
        model_loader_extra_config:
          enable_multithread_load: true
          num_threads: 16
