server_url: http://0.0.0.0:8008

# CHANGE: must match api_key in server.yaml
api_key: hypotest-secret

# Start small for testing; increase once confirmed working
num_parallel: 10
num_replications: 1  # [PATCH 13] run each problem 3 times; computes avg@3 and pass@3

results_dir: archive/fork_trial/benchmark_results/

agent_config:
  agent_type: HFSimpleAgent
  agent_kwargs:
    llm_model:
      name: Qwen/Qwen3.6-27B
      config:
        model_list:
          - model_name: Qwen/Qwen3.5-2B
            litellm_params:
              model: openai/Qwen/Qwen3.5-2B
              api_base: http://172.16.19.71:8000/v1
              api_key: "none"
              temperature: 1.0
              timeout: 600
              max_tokens: 4096
          - model_name: Qwen/Qwen3.5-9B
            litellm_params:
              model: openai/Qwen/Qwen3.5-9B
              api_base: http://172.16.19.71:8000/v1
              api_key: "none"
              temperature: 1.0
              timeout: 600
              max_tokens: 4096
          - model_name: Qwen/Qwen3.6-27B-FP8
            litellm_params:
              model: openai/Qwen/Qwen3.6-27B-FP8
              api_base: http://172.16.19.71:8000/v1
              api_key: "none"
              temperature: 1.0
              timeout: 600
              max_tokens: 4096
          - model_name: Qwen/Qwen3.6-27B
            litellm_params:
              model: openai/Qwen/Qwen3.6-27B
              api_base: http://172.16.19.71:8000/v1
              api_key: "none"
              temperature: 1.0
              timeout: 600
              max_tokens: 4096
          - model_name: claude-sonnet-4-6
            litellm_params:
              model: anthropic/claude-sonnet-4-6
              reasoning_effort: high
              max_tokens: 120000
              timeout: 3600
